{% load static %}<!DOCTYPE html>
<html lang="pt-br" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · IFMA Inova</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="h-full antialiased bg-ifma-navy bg-cover bg-center"
      style="background-image: linear-gradient(to right, rgba(7,42,74,.35), rgba(7,42,74,.92) 65%), url('{% static 'img/login-bg.jpg' %}');">
  <div class="flex min-h-screen items-center justify-end px-6 sm:px-16 lg:px-24">
    <div class="w-full max-w-sm">
      <div class="mb-8 flex items-center justify-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-ifma-gold flex items-center justify-center font-display font-extrabold text-ifma-navy">I</div>
        <div>
          <p class="font-display font-bold text-white leading-tight">IFMA Inova</p>
          <p class="text-xs text-slate-300 leading-tight">Estratégia institucional</p>
        </div>
      </div>

      <div class="rounded-2xl bg-white p-8 shadow-xl">
        <h1 class="text-lg font-semibold text-slate-900">Entrar</h1>
        <p class="mt-1 text-sm text-slate-500">Acesse o painel da política de inovação.</p>

        {% if form.errors %}
        <div class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">
          Usuário ou senha inválidos.
        </div>
        {% endif %}

        <form method="post" class="mt-6 space-y-4">
          {% csrf_token %}
          <div>
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-slate-700">Usuário</label>
            <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" autofocus required
                   class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-ifma-navy focus:outline-none focus:ring-1 focus:ring-ifma-navy">
          </div>
          <div>
            <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-slate-700">Senha</label>
            <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" required
                   class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-ifma-navy focus:outline-none focus:ring-1 focus:ring-ifma-navy">
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit"
                  class="w-full rounded-lg bg-ifma-navy px-4 py-2 text-sm font-semibold text-white hover:bg-ifma-navy-light">
            Entrar
          </button>
        </form>
      </div>
      <p class="mt-6 text-center text-xs text-slate-300">Fábrica de Inovação · IFMA</p>
    </div>
  </div>
</body>
</html>
