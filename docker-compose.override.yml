# Aplicado automaticamente pelo `docker compose` em desenvolvimento local
# (mesclado com docker-compose.yml). Não é usado em produção/Portainer,
# que só enxerga docker-compose.yml.
services:
  db:
    ports:
      - "5433:5432"

  migrations:
    volumes:
      - .:/app

  web:
    # Mantém o autoreload em dev (sem --noreload); --nostatic para manter o
    # mesmo caminho de código de estáticos usado em produção.
    command: python manage.py runserver --nostatic 0.0.0.0:${DJANGO_PORT:-8013}
    volumes:
      - .:/app

  tailwind:
    build: .
    entrypoint: ["tailwindcss"]
    command: ["-i", "./static_src/input.css", "-o", "./static/css/tailwind.css", "--watch=always"]
    volumes:
      - .:/app

  observatorio:
    volumes:
      - ./observatorio:/app
      - /app/node_modules
